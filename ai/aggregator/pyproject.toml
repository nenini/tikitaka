[project]
name = "aggregator"
version = "0.1.0"
description = "통제실 — 실시간 코칭 집계 엔진 (STT 신호 → 분석 이벤트)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "numpy>=2.1",
]

# aggregator는 stt와 같은 방식(pythonpath)으로 stt 패키지를 참조한다.
# stt는 build-system이 없어 editable 설치 대상이 아니므로, 의존성으로 넣지 않고
# pythonpath(../stt)로 import 한다. live_demo 런타임은 stt의 풀 의존(faster-whisper 등)이 필요.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = [".", "../stt"]
testpaths = ["tests"]

# strict = implicit Any·bare generic·untyped def 전부 금지. 이 프로젝트 코드에는 Any를 쓰지 않는다.
# (disallow_any_explicit은 pydantic.mypy 플러그인이 생성하는 내부 Any와 충돌하므로 쓰지 않는다.)
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "../stt"
files = ["aggregator", "tests"]

# 서드파티(스텁 없음) — 런타임 전용, 타입체크에서 무시
[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

# stt는 타입 힌트가 있으나 py.typed가 없어 소스 타입을 따라가되(에러는 silent로 억제),
# stt 코드 자체는 이 프로젝트의 검사 대상이 아니다(별도 소유).
[[tool.mypy.overrides]]
module = ["stt", "stt.*"]
follow_untyped_imports = true
follow_imports = "silent"
