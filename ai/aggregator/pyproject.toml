[project]
name = "aggregator"
version = "0.1.0"
description = "통제실 — 실시간 코칭 집계 엔진 (STT 신호 → 분석 이벤트)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "livekit>=1.0",
    "pydantic>=2.13.4",
    "numpy>=2.1",
    "python-dotenv>=1.1",
    "stt-pipeline",
    "chatbot",
    "tts",
    "uvicorn[standard]>=0.35",
]

[tool.uv.sources]
# editable — 안 붙이면 휠 복사본이 설치돼 형제 폴더 수정이 여기 반영되지 않는다
stt-pipeline = { path = "../stt", editable = true }
# AI 화상 세션이 쓴다. HTTP로 부르지 않고 프롬프트·TTS 함수만 임포트한다.
chatbot = { path = "../chatbot", editable = true }
tts = { path = "../tts", editable = true }

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = [".", "../stt"]
testpaths = ["tests"]

# strict = implicit Any·bare generic·untyped def 전부 금지. 이 프로젝트 코드에는 Any를 쓰지 않는다.
# (disallow_any_explicit은 pydantic.mypy 플러그인이 생성하는 내부 Any와 충돌하므로 쓰지 않는다.)
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "../stt:../chatbot:../tts"
files = ["aggregator", "tests"]

# 서드파티(스텁 없음) — 런타임 전용, 타입체크에서 무시
[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "soundfile",   # tts 가 쓴다(경로 의존이라 그쪽 override 를 물려받지 못한다)
    "soxr",
    "faster_whisper",
    "faster_whisper.*",
    "livekit",
    "livekit.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true

# stt는 타입 힌트가 있으나 py.typed가 없어 소스 타입을 따라가되(에러는 silent로 억제),
# stt 코드 자체는 이 프로젝트의 검사 대상이 아니다(별도 소유).
[[tool.mypy.overrides]]
module = ["stt", "stt.*"]
follow_untyped_imports = true
follow_imports = "silent"
