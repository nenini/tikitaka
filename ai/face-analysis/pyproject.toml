[project]
name = "face-analysis"
version = "0.1.0"
description = "Privacy-conscious face quality and entertainment face-type analysis"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "opencv-python-headless==4.13.0.92",
    "torch==2.7.0",
    "torchvision==0.22.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
