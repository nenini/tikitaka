# AI 서비스 오케스트레이션 — ai/ 루트에서 전체를 관리한다.
#   docker compose up --build            # 전체 빌드·실행
#   docker compose up --build chatbot    # 특정 서비스만
#   docker compose down                  # 정지·제거
#
# 각 서비스의 Dockerfile은 해당 폴더에 있고(빌드 컨텍스트 = 그 폴더),
# 이 파일이 묶어서 실행한다. 서비스끼리 포트·컨테이너 이름이 겹치지 않게 분리한다.
# LLM/모델 추론은 컨테이너 밖 호스트(Ollama 등)에 붙는다.
services:
  chatbot:
    build:
      context: ./chatbot
    image: ssafy-ai-chatbot:latest
    container_name: ai-chatbot
    ports:
      - "8000:8000"                                 # 챗봇 스트리밍 API
    environment:
      OLLAMA_HOST: "http://host.docker.internal:11434"
      # OLLAMA_MODEL: "exaone3.5:2.4b"              # GPU 여유 부족 시 경량 모델
      # AI_CHAT_INTERNAL_TOKEN: "change-me"         # 설정하면 X-Internal-Token 검사 활성화
    extra_hosts:
      - "host.docker.internal:host-gateway"         # Linux 호환(Docker Desktop은 자동)
    restart: unless-stopped

  # 얼굴상 분석(FastAPI). CPU 실행. 포트 8001로 chatbot(8000)과 분리.
  # ⚠️ 모델 아티팩트·참조 데이터가 gitignore라, 아래 볼륨에 팀원(AI2)의 파일이 있어야 동작한다.
  #    - ./face-analysis/artifacts/  : face_detection_yunet_2023mar.onnx, face_landmarker.task, facenet 가중치
  #    - ./face-analysis/data/       : processing_report.csv(레포 있음) + 참조 이미지(gitignore)
  #    없으면 startup(모델 로드)에서 부팅 실패한다.
  face-analysis:
    build:
      context: ./face-analysis
    image: ssafy-ai-face:latest
    container_name: ai-face
    ports:
      - "8001:8000"
    volumes:
      - ./face-analysis/artifacts:/app/artifacts:ro
      - ./face-analysis/data:/app/data:ro
    restart: unless-stopped

  # 관제실 — BE가 세션 라이프사이클을 보내는 대상(AI_SESSION_BASE_URL).
  # ⚠️ 빌드 컨텍스트가 여기(ai/)다. aggregator/ 가 아니다 —
  #    pyproject 의 `stt-pipeline = { path = "../stt" }` 때문에 형제 폴더가 필요하다.
  # ⚠️ GPU: Whisper 가 프로세스 안에서 돈다. 아래 deploy 블록은 GPU 있는 호스트에서만
  #    유효하므로, CPU 로 띄우려면 지우고 STT_DEVICE=cpu 로 바꾼다.
  # LLM(코칭·리포트)은 컨테이너 밖에 붙는다. 비우면 규칙 기반 폴백만 나간다.
  aggregator:
    build:
      context: ./
      dockerfile: aggregator/Dockerfile
    image: ssafy-ai-aggregator:latest
    container_name: ai-aggregator
    ports:
      - "8002:8000"                                   # 관제실 API · GET /health
    environment:
      STT_DEVICE: "cuda:0"                            # CUDA_VISIBLE_DEVICES 적용 후 논리번호
      CUDA_VISIBLE_DEVICES: "3"                       # 공유 서버 에티켓 — 3번만 사용
      COACHING_LLM_BASE_URL: "http://host.docker.internal:11500"
      REPORT_LLM_BASE_URL: "http://host.docker.internal:11500"
      REPORT_LLM_MODEL: "exaone3.5:7.8b"
      # BACKEND_BASE_URL: "http://host.docker.internal:8080"
      # AI_SESSION_INTERNAL_TOKEN: "change-me"        # BE와 같은 값. 비면 401
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # vision-analysis는 브라우저용 TS 라이브러리라 도커 대상이 아님(FE 번들에 포함).
