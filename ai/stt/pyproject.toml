[project]
name = "stt-pipeline"
version = "0.1.0"
description = "화자별 마이크 → STT → TranscriptEvent 입력 파이프라인 (통제실 입력단)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
    "pydantic>=2.13.4",
    "sounddevice>=0.5.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
