[project]
name = "stt-pipeline"
version = "0.1.0"
description = "화자별 마이크 → STT → TranscriptEvent 입력 파이프라인 (통제실 입력단)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.1,<2.5",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
    "pydantic>=2.13.4",
    "sounddevice>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stt"]

# `[tool.uv] package = false`를 두면 안 된다. aggregator가 이 프로젝트를
# `stt-pipeline = { path = "../stt" }`로 의존하는데, false면 uv가 휠을 만들지 않아
# aggregator venv에 `stt` 모듈이 들어오지 않는다(`python -m aggregator`가 ImportError).
# 지금까지 드러나지 않은 건 pytest가 pythonpath로 우회했기 때문이다.

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# files 가 없으면 인자 없는 `uv run mypy` 가 "Missing target" 으로 실패한다 — CI에서
# 타입 검사가 통째로 안 돌게 된다. aggregator·tts 와 같은 형태로 맞춘다.
files = ["stt", "tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "sounddevice.*"]
ignore_missing_imports = true
