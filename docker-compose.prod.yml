name: a307

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/a307/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      face-analysis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  frontend:
    image: a307-frontend:${FRONTEND_VERSION:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/frontend-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  face-analysis:
    image: a307-face-analysis:${FACE_ANALYSIS_VERSION:-latest}
    build:
      context: ./ai/face-analysis
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ${FACE_ANALYSIS_ARTIFACTS_DIR:-/opt/a307/ai-data/face-analysis/artifacts}:/app/artifacts:ro
      - ${FACE_ANALYSIS_DATA_DIR:-/opt/a307/ai-data/face-analysis/data}:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/internal/v1/face-analysis/health', timeout=5)); assert data['analysisReady']"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - internal

  chatbot:
    image: a307-chatbot:${CHATBOT_VERSION:-latest}
    build:
      context: ./ai/chatbot
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:18150}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-exaone3.5:7.8b}
      AI_CHAT_INTERNAL_TOKEN: ${AI_CHAT_INTERNAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal

  backend:
    image: a307-backend:${APP_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${ENV_FILE:-/opt/a307/.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      AI_CHAT_BASE_URL: http://chatbot:8000
      LOCAL_MATCH_TEST_USERS_ENABLED: "false"
      LOCAL_RESULT_TEST_SESSION_ENABLED: "false"
      LOCAL_ADMIN_TEST_USER_ENABLED: "false"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      chatbot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - internal

volumes:
  mysql-data:
    name: a307-mysql-data

networks:
  internal:
    name: a307-internal
