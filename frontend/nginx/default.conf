server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /frontend-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # MediaPipe 모델(.task)·WASM 런타임.
    #
    # ⚠️ SPA 폴백에서 반드시 빼야 한다. `location /` 의 try_files 는 파일이 없으면
    #    index.html 을 **200** 으로 돌려주는데, 그러면 MediaPipe 가 HTML 을 모델로 읽고
    #    "not a valid model" 같은 엉뚱한 오류를 내거나 무한히 기다린다. 없는 자산은
    #    404 로 정직하게 떨어져야 프론트가 분석을 UNAVAILABLE 로 내리고 통화만 살릴 수 있다.
    #
    # nginx mime.types 에 `.task` 가 없어 default_type 을 직접 지정한다.
    location ^~ /models/ {
        default_type application/octet-stream;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /mediapipe/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|wasm|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
