services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-date}
      MYSQL_USER: ${MYSQL_USER:-date}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-date}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-date}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: ${MYSQL_USER:-date}
      DB_PASSWORD: ${MYSQL_PASSWORD:-date}
      JWT_SECRET: ${JWT_SECRET:-date-service-local-development-secret-key-change-me-please}
      JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:-1800}
      JWT_REFRESH_TOKEN_VALIDITY_SECONDS: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:-1209600}
      PASSWORD_RESET_TOKEN_VALIDITY_SECONDS: ${PASSWORD_RESET_TOKEN_VALIDITY_SECONDS:-900}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/password-reset}
      MAIL_FROM: ${MAIL_FROM:-no-reply@date.local}
      MAIL_HOST: ${MAIL_HOST:-host.docker.internal}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      OAUTH_STATE_VALIDITY_SECONDS: ${OAUTH_STATE_VALIDITY_SECONDS:-300}
      OAUTH_SECURE_COOKIE: ${OAUTH_SECURE_COOKIE:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oauth2/google/callback}
      NAVER_OAUTH_CLIENT_ID: ${NAVER_OAUTH_CLIENT_ID:-}
      NAVER_OAUTH_CLIENT_SECRET: ${NAVER_OAUTH_CLIENT_SECRET:-}
      NAVER_OAUTH_REDIRECT_URI: ${NAVER_OAUTH_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oauth2/naver/callback}
      FACE_ANALYSIS_REQUEST_VALIDITY_SECONDS: ${FACE_ANALYSIS_REQUEST_VALIDITY_SECONDS:-600}
      LOCAL_MATCH_TEST_USERS_ENABLED: ${LOCAL_MATCH_TEST_USERS_ENABLED:-true}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-}
      AI_CHAT_STREAM_PATH: ${AI_CHAT_STREAM_PATH:-/api/v1/chat/stream}
      AI_CHAT_CONNECT_TIMEOUT: ${AI_CHAT_CONNECT_TIMEOUT:-3s}
      AI_CHAT_REQUEST_TIMEOUT: ${AI_CHAT_REQUEST_TIMEOUT:-270s}
      AI_CHAT_SSE_TIMEOUT: ${AI_CHAT_SSE_TIMEOUT:-300s}
      AI_CHAT_INTERNAL_TOKEN: ${AI_CHAT_INTERNAL_TOKEN:-}
      AI_SESSION_BASE_URL: ${AI_SESSION_BASE_URL:-}
      AI_SESSION_EVENT_PATH: ${AI_SESSION_EVENT_PATH:-/api/v1/sessions/events}
      AI_SESSION_CONNECT_TIMEOUT: ${AI_SESSION_CONNECT_TIMEOUT:-3s}
      AI_SESSION_REQUEST_TIMEOUT: ${AI_SESSION_REQUEST_TIMEOUT:-5s}
      AI_SESSION_INTERNAL_TOKEN: ${AI_SESSION_INTERNAL_TOKEN:-}
      AI_SESSION_EVENT_MAX_ATTEMPTS: ${AI_SESSION_EVENT_MAX_ATTEMPTS:-3}
      AI_SESSION_EVENT_RETRY_DELAY: ${AI_SESSION_EVENT_RETRY_DELAY:-1s}
      AI_TRANSCRIPT_BASE_URL: ${AI_TRANSCRIPT_BASE_URL:-}
      AI_TRANSCRIPT_PATH_TEMPLATE: ${AI_TRANSCRIPT_PATH_TEMPLATE:-}
      AI_TRANSCRIPT_CONNECT_TIMEOUT: ${AI_TRANSCRIPT_CONNECT_TIMEOUT:-3s}
      AI_TRANSCRIPT_REQUEST_TIMEOUT: ${AI_TRANSCRIPT_REQUEST_TIMEOUT:-15s}
      AI_TRANSCRIPT_INTERNAL_TOKEN: ${AI_TRANSCRIPT_INTERNAL_TOKEN:-}
      AI_TRANSCRIPT_MAX_ATTEMPTS: ${AI_TRANSCRIPT_MAX_ATTEMPTS:-5}
      AI_TRANSCRIPT_RETRY_DELAY: ${AI_TRANSCRIPT_RETRY_DELAY:-2s}
      AI_REPORT_BASE_URL: ${AI_REPORT_BASE_URL:-}
      AI_REPORT_GENERATION_PATH: ${AI_REPORT_GENERATION_PATH:-/internal/v1/session-reports/generate}
      AI_REPORT_CONNECT_TIMEOUT: ${AI_REPORT_CONNECT_TIMEOUT:-3s}
      AI_REPORT_REQUEST_TIMEOUT: ${AI_REPORT_REQUEST_TIMEOUT:-10s}
      AI_REPORT_MAX_ATTEMPTS: ${AI_REPORT_MAX_ATTEMPTS:-3}
      AI_REPORT_RETRY_DELAY: ${AI_REPORT_RETRY_DELAY:-2s}
      AI_REPORT_GENERATION_TIMEOUT: ${AI_REPORT_GENERATION_TIMEOUT:-5m}
      AI_REPORT_TIMEOUT_BATCH_SIZE: ${AI_REPORT_TIMEOUT_BATCH_SIZE:-100}
      AI_REPORT_TIMEOUT_MONITOR_FIXED_DELAY_MS: ${AI_REPORT_TIMEOUT_MONITOR_FIXED_DELAY_MS:-30000}
      AI_REPORT_TIMEOUT_MONITOR_INITIAL_DELAY_MS: ${AI_REPORT_TIMEOUT_MONITOR_INITIAL_DELAY_MS:-30000}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_EMPTY_TIMEOUT_SECONDS: ${LIVEKIT_EMPTY_TIMEOUT_SECONDS:-600}
      LIVEKIT_MAX_PARTICIPANTS: ${LIVEKIT_MAX_PARTICIPANTS:-3}
      ROOM_ENTRY_OPEN_BEFORE: ${ROOM_ENTRY_OPEN_BEFORE:-10m}
      ROOM_ENTRY_CLOSE_AFTER: ${ROOM_ENTRY_CLOSE_AFTER:-10m}
      SESSION_REALTIME_MONITOR_ENABLED: ${SESSION_REALTIME_MONITOR_ENABLED:-true}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-data:
