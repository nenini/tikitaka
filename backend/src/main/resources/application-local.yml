spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/date?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate

app:
  local-seed:
    match-test-users-enabled: ${LOCAL_MATCH_TEST_USERS_ENABLED:true}
    result-test-session-enabled: ${LOCAL_RESULT_TEST_SESSION_ENABLED:true}
    admin-test-user-enabled: ${LOCAL_ADMIN_TEST_USER_ENABLED:true}
    admin-email: ${LOCAL_ADMIN_EMAIL:admin@example.com}
    admin-password: ${LOCAL_ADMIN_PASSWORD:qwer1234@}
