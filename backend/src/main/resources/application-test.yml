spring:
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:date;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

match:
  policy:
    late-cancellation-threshold-seconds: 86400
  worker:
    enabled: false
    fixed-delay-ms: 1000
    initial-delay-ms: 10000
    batch-size: 20
    max-attempts: 3
    initial-backoff-seconds: 5
    max-backoff-seconds: 300
    processing-timeout-seconds: 60
  scheduler:
    enabled: false
    fixed-delay-ms: 10000
    initial-delay-ms: 10000
    acceptance-timeout-seconds: 28800
    minimum-acceptance-window-seconds: 3600
    schedule-buffer-seconds: 3600

notification:
  sse:
    enabled: false
    timeout-ms: 1800000
    retry-ms: 3000
    heartbeat-interval-ms: 30000
  worker:
    enabled: false
    fixed-delay-ms: 1000
    initial-delay-ms: 10000
    batch-size: 20
    max-attempts: 3
    retry-delay-seconds: 5
    processing-timeout-seconds: 60
