<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-19 · 마이페이지 (모바일)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="p-frame">
  <div class="notch"></div>
  <div class="pbar"><span class="back">‹</span><h1>마이페이지</h1></div>
  <div class="pbody">

  <div class="card col g8 ac">
    <div class="av l">유</div><b style="font-size:16px">유월</b>
    <span class="tiny">20대 후반 · 서울 강남구</span>
    <div class="row g4"><span class="chip on">🐰 토끼상</span></div>
    <div class="row ae g6"><span class="temp">38.2<small>°</small></span></div>
    <div class="meter warm" style="width:100%"><i style="width:52%"></i></div>
  </div>
  <div class="card col g6"><span class="h3">약관·개인정보 동의</span>
    <div class="lrow"><div class="col f1"><span class="tt" style="font-size:12px">약관·분석·리포트 통합</span><span class="ss">계정 필수</span></div><span class="badge ok">동의</span></div>
    <div class="lrow"><span class="tt" style="flex:1;font-size:12px">얼굴 촬영·분석 (선택)</span><span class="toggle on"></span></div>
  </div>
  <div class="card col g6"><span class="h3">참여 기록</span>
    <div class="row g12"><div class="stat"><span class="v">8</span><span class="k">세션</span></div>
      <div class="stat"><span class="v">0</span><span class="k">노쇼</span></div>
      <div class="stat"><span class="v">1</span><span class="k">취소</span></div></div></div>
  <div class="row g4 wrap"><span class="chip">차단 목록</span><span class="chip">얼굴 재촬영</span><span class="chip no">탈퇴</span></div>
  </div>
<div class="tabbar"><div class=""><i>🏠</i>홈</div><div class=""><i>💘</i>매칭</div><div class="on"><i>📊</i>리포트</div><div class=""><i>🔔</i>알림</div></div>
</div></body></html>
