<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-04 · 기본 프로필 (모바일)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="p-frame">
  <div class="notch"></div>
  <div class="pbar"><span class="back">‹</span><h1>기본 프로필</h1></div>
  <div class="pbody">

  <div class="row g8 ac"><span class="badge">4 / 5</span><span class="h3">기본 프로필</span></div>
  <div class="meter"><i style="width:80%"></i></div>
  <div class="row g6 ac"><span class="scope pub">상대 공개</span></div>
  <div class="field"><label>닉네임</label><div class="input"><span>유월</span></div></div>
  <div class="row g8"><div class="field f1"><label>키 (cm)</label><div class="input"><span>167</span></div></div>
    <div class="field f1"><label>성별</label><div class="input"><span>여성</span></div></div></div>
  <div class="row g6 ac"><span class="scope int">매칭 전용</span></div>
  <div class="row g8"><div class="field f1"><label>시 · 도</label><div class="input"><span>서울</span></div></div>
    <div class="field f1"><label>구 · 군</label><div class="input"><span>강남구</span></div></div></div>
  <div class="field"><label>선호 연령 26 ~ 33세</label>
    <div class="slider"><i style="width:62%"></i><b style="left:12%"></b><b style="left:62%"></b></div></div>
  <a class="btn block mta">다음 · 얼굴 촬영</a>
  </div>

</div></body></html>
