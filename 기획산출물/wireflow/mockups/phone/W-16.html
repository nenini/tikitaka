<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-16 · AI 세션 리포트 (모바일)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="p-frame">
  <div class="notch"></div>
  <div class="pbar"><span class="back">‹</span><h1>AI 세션 리포트</h1></div>
  <div class="pbody">

  <div class="row g6"><span class="badge ok">상대 평가 반영</span><span class="badge">온도 +1.7°</span></div>
  <div class="card col g8"><span class="h3">AI 분석 vs 상대 평가</span>
    <div class="radar" style="width:100%"><div class="poly"></div></div>
    <div class="row g10"><span class="row g4 ac tiny"><span class="dot" style="background:var(--bt-color-action)"></span>AI</span>
      <span class="row g4 ac tiny"><span class="dot" style="background:var(--bt-rose-500)"></span>상대</span></div></div>
  <div class="card warn col g6">
    <div class="row g6 ac"><span class="badge wa">감지</span><b style="font-size:12px">결혼·출산 압박 · 12:34</b></div>
    <span class="tiny">상대가 직장 이야기를 하던 중 화제를 전환하셨어요.</span>
    <span class="alt tiny">💡 "앞으로 어떤 삶을 살고 싶은지 궁금해요"</span></div>
  <div class="card col g6"><span class="h3">행동 근거</span>
    <div class="row g12 wrap"><div class="stat"><span class="v">68%</span><span class="k">발화 비율</span></div>
      <div class="stat"><span class="v">35%</span><span class="k">확장 질문</span></div>
      <div class="stat"><span class="v">2회</span><span class="k">말 끊기</span></div></div></div>
  <div class="card col g6"><span class="h3">다음 미션</span>
    <div class="row g4 wrap"><span class="chip on">확장 질문 3회</span><span class="chip on">발화 55% 이하</span></div></div>
  </div>
<div class="tabbar"><div class=""><i>🏠</i>홈</div><div class=""><i>💘</i>매칭</div><div class="on"><i>📊</i>리포트</div><div class=""><i>🔔</i>알림</div></div>
</div></body></html>
