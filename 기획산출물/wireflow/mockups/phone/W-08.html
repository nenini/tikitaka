<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-08 · 홈 (모바일)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="p-frame">
  <div class="notch"></div>
  <div class="pbar"><span class="back">‹</span><h1>홈</h1></div>
  <div class="pbody">

  <div class="card col g10">
    <span class="h3">사랑의 온도</span>
    <div class="row ae g6"><span class="temp">38.2<small>°</small></span><span class="badge ok">▲ 1.7</span></div>
    <div class="meter warm"><i style="width:52%"></i></div>
    <div class="row g16"><div class="stat"><span class="v">7</span><span class="k">완료 세션</span></div>
      <div class="stat"><span class="v">0</span><span class="k">노쇼</span></div></div>
  </div>
  <div class="card col g10 f1">
    <div class="row jb ac"><span class="h3">예정된 세션</span><span class="badge wa">2시간 뒤</span></div>
    <div class="row g10 ac"><div class="av m">유</div>
      <div class="col g4 f1"><b style="font-size:14px">유월</b><span class="tiny">20대 후반 · 🐰 토끼상</span>
        <span class="tiny">오늘 19:00 · 저녁 식당</span></div></div>
    <div class="banner in"><span>ℹ️</span><span>1시간 전까지 취소 시 패널티 없음</span></div>
    <a class="btn block">대기방 입장</a>
    <a class="btn ghost block">일정 취소</a>
  </div>
  <a class="btn block mta">새 매칭 시작</a>
  </div>
<div class="tabbar"><div class="on"><i>🏠</i>홈</div><div class=""><i>💘</i>매칭</div><div class=""><i>📊</i>리포트</div><div class=""><i>🔔</i>알림</div></div>
</div></body></html>
