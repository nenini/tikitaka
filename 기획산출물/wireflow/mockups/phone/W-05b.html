<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-05b · 얼굴상 태그 결과 (모바일)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="p-frame">
  <div class="notch"></div>
  <div class="pbar"><span class="back">‹</span><h1>얼굴상 태그 결과</h1></div>
  <div class="pbody">

  <div class="col g4"><h1 class="h1">분석이 끝났어요</h1>
    <p class="muted">재미로 보는 <b>분위기 태그</b>예요.</p></div>
  <div class="card col g8 sel">
    <div class="row jb ac"><span class="badge">1순위</span><span class="tiny">82%</span></div>
    <div class="row g8 ac"><span style="font-size:32px">🐰</span><b style="font-size:17px">토끼상</b></div>
    <div class="row g4 wrap"><span class="chip">수지</span><span class="chip">아이유</span><span class="chip">박보영</span></div>
  </div>
  <div class="card col g8">
    <div class="row jb ac"><span class="badge gray">2순위</span><span class="tiny">61%</span></div>
    <div class="row g8 ac"><span style="font-size:32px">🌙</span><b style="font-size:17px">차분한 인상</b></div>
  </div>
  <div class="card col g6"><div class="row jb ac"><b style="font-size:12.5px">얼굴상 공개</b><span class="toggle on"></span></div></div>
  <p class="tiny">원본 사진은 분석 직후 삭제됐어요.</p>
  <a class="btn block mta">다음 · 설문</a>
  </div>

</div></body></html>
