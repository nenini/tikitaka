<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-19b · 개인정보 수정·관리 (모바일)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="p-frame">
  <div class="notch"></div>
  <div class="pbar"><span class="back">‹</span><h1>개인정보 수정·관리</h1></div>
  <div class="pbody">

  <p class="muted">온보딩할 때 입력한 개인정보를 다시 찍거나 수정할 수 있어요.</p>

  <div class="card col g6">
    <div class="row jb ac"><span class="h3">얼굴 사진 · 얼굴상</span><span class="chip on">🐰 토끼상</span></div>
    <span class="tiny">다시 찍으면 얼굴상이 재분석돼요. 원본은 즉시 삭제.</span>
    <a class="btn ghost sm block">얼굴 다시 찍기</a>
  </div>
  <div class="card col g6">
    <span class="h3">이상형 · 개선 목표 설문</span>
    <div class="lrow"><span class="tt" style="font-size:12px">선호 얼굴상</span><span class="rt">🐰 🐱</span></div>
    <div class="lrow"><span class="tt" style="font-size:12px">선호 연령</span><span class="rt">27–33세</span></div>
    <div class="lrow"><span class="tt" style="font-size:12px">개선 목표</span><span class="rt">발화량 줄이기</span></div>
    <a class="btn ghost sm block">설문 다시 하기</a>
  </div>
  <div class="card col g6">
    <span class="h3">기본 프로필</span>
    <div class="lrow"><span class="tt" style="font-size:12px">닉네임 · 성별</span><span class="rt">유월 · 여성</span></div>
    <a class="btn ghost sm block">수정</a>
  </div>
  <div class="card col g6">
    <span class="h3">지역 (시·도)</span>
    <div class="lrow"><span class="tt" style="font-size:12px">시·도</span><span class="rt">서울특별시</span></div>
    <a class="btn ghost sm block">수정</a>
  </div>
  <div class="banner in"><span>ℹ️</span><span>키·직업·실명·전화는 <b>수집 안 함</b></span></div>
  </div>
<div class="tabbar"><div class=""><i>🏠</i>홈</div><div class=""><i>💘</i>매칭</div><div class="on"><i>📊</i>리포트</div><div class=""><i>🔔</i>알림</div></div>
</div></body></html>
