<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-08b · 매칭 트랙 선택 (모바일)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="p-frame">
  <div class="notch"></div>
  <div class="pbar"><span class="back">‹</span><h1>매칭 트랙 선택</h1></div>
  <div class="pbody">

  <p class="muted">동시 진행 매칭은 <b>1개</b>. AI 화상은 큐를 유지해요.</p>
  <div class="card col g8 sel">
    <div class="row jb ac"><span style="font-size:26px">🧑</span><span class="badge">추천</span></div>
    <b style="font-size:15px">실사용자 화상 세션</b>
    <div class="row g6 wrap"><span class="chip">⏱ 30분</span><span class="chip">대기 필요</span><span class="chip ok">상호 평가</span></div>
    <a class="btn block sm">대기 큐 등록</a>
  </div>
  <div class="card col g8">
    <div class="row jb ac"><span style="font-size:26px">🤖</span><span class="badge wa">P1</span></div>
    <b style="font-size:15px">AI 화상 연습</b>
    <div class="row g6 wrap"><span class="chip">⏱ 10~15분</span><span class="chip ok">즉시</span><span class="chip no">평가 없음</span></div>
    <a class="btn ghost block sm">시작</a>
  </div>
  <div class="card col g8">
    <div class="row jb ac"><span style="font-size:26px">💬</span></div>
    <b style="font-size:15px">AI 챗봇 대화</b>
    <div class="row g6 wrap"><span class="chip">텍스트</span><span class="chip ok">24시간</span><span class="chip no">큐 해제</span></div>
    <a class="btn ghost block sm">시작</a>
  </div>
  </div>
<div class="tabbar"><div class=""><i>🏠</i>홈</div><div class="on"><i>💘</i>매칭</div><div class=""><i>📊</i>리포트</div><div class=""><i>🔔</i>알림</div></div>
</div></body></html>
