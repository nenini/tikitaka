<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-17 · 성장 대시보드 (모바일)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="p-frame">
  <div class="notch"></div>
  <div class="pbar"><span class="back">‹</span><h1>성장 대시보드</h1></div>
  <div class="pbody">

  <div class="card col g8">
    <span class="h3">사랑의 온도</span>
    <div class="row ae g6"><span class="temp">38.2<small>°</small></span><span class="badge ok">▲ 1.7</span></div>
    <div class="meter warm"><i style="width:52%"></i></div>
    <div class="row g12"><div class="stat"><span class="v">8</span><span class="k">세션</span></div>
      <div class="stat"><span class="v">0</span><span class="k">노쇼</span></div>
      <div class="stat"><span class="v">4</span><span class="k">뱃지</span></div></div>
  </div>
  <div class="card col g8"><span class="h3">온도 추이</span>
    <div class="row ae g4" style="height:82px">
      <div style="flex:1;height:22px;border-radius:4px 4px 0 0;background:var(--bt-color-action)"></div><div style="flex:1;height:28px;border-radius:4px 4px 0 0;background:var(--bt-color-action)"></div><div style="flex:1;height:25px;border-radius:4px 4px 0 0;background:var(--bt-color-action)"></div><div style="flex:1;height:40px;border-radius:4px 4px 0 0;background:var(--bt-blue-300)"></div><div style="flex:1;height:46px;border-radius:4px 4px 0 0;background:var(--bt-color-action)"></div><div style="flex:1;height:42px;border-radius:4px 4px 0 0;background:var(--bt-color-action)"></div><div style="flex:1;height:58px;border-radius:4px 4px 0 0;background:var(--bt-blue-300)"></div><div style="flex:1;height:66px;border-radius:4px 4px 0 0;background:var(--bt-color-action)"></div>
    </div>
    <span class="tiny">파란 막대 = AI 트랙 (별도 표기)</span></div>
  <div class="card col g6"><span class="h3">누적 강점</span>
    <div class="row g4 wrap"><span class="chip ok">편안한 분위기 ×5</span><span class="chip ok">공감 ×4</span></div></div>
  <div class="card col g6"><span class="h3">뱃지</span>
    <div class="row g4 wrap"><span class="chip">🌱 첫 연습</span><span class="chip">👂 경청</span><span class="chip">🔥 5회</span></div></div>
  </div>
<div class="tabbar"><div class=""><i>🏠</i>홈</div><div class=""><i>💘</i>매칭</div><div class="on"><i>📊</i>리포트</div><div class=""><i>🔔</i>알림</div></div>
</div></body></html>
