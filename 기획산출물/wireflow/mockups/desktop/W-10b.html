<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-10b · 챗봇 대화 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame">
<div class="appbar"><span class="logo">BloomTalk</span>
    <div class="nav"><a class="">홈</a><a class="on">매칭</a><a class="">리포트</a><a class="">성장</a></div>
    <div class="right"><span style="font-size:17px">🔔</span><div class="av s">나</div></div></div>
  <div class="body">

  <div class="row g16 f1">
    <div class="card col g10" style="width:280px">
      <span class="h3">페르소나</span>
      <div class="row g10 ac"><div class="av m">🤖</div><div class="col g4"><b style="font-size:15px">지우</b>
        <span class="tiny">다정한 말투 · 차분한</span></div></div>
      <div class="row g6 wrap"><span class="chip">소개팅 전</span><span class="chip">보통</span><span class="chip">호의적</span></div>
      <div style="height:1px;background:var(--bt-color-border)"></div>
      <span class="h3">이 연습의 목표</span>
      <span class="tiny">약속 일시·장소를 자연스럽게 정해보기</span>
      <a class="btn ghost sm block mta">대화 종료</a>
    </div>
    <div class="card pad-lg col f1" style="padding:0">
      <div class="row jb ac" style="padding:14px 18px;border-bottom:1px solid var(--bt-color-border)">
        <div class="row g8 ac"><div class="av s">🤖</div><b style="font-size:14px">지우</b><span class="dot"></span></div>
        <span class="tiny">오늘</span></div>
      <div class="col g10 f1" style="padding:18px;overflow:hidden">
        <div class="bub them">안녕하세요! 오늘 하루 어떠셨어요?</div>
        <div class="bub me">안녕하세요 :) 오늘은 좀 바빴는데 이제 좀 여유가 생겼어요</div>
        <div class="bub them">바쁘셨군요, 고생 많으셨어요. 저는 오늘 카페에서 책 좀 읽었어요.<br>혹시 카페 자주 가시는 편이에요?</div>
        <div class="bub me">네 좋아해요! 조용한 데 찾아다니는 편이에요</div>
        <div class="row g6 ac" style="align-self:center"><span class="badge wa">선톡</span><span class="tiny">12시간 무응답 · 1회 한정</span></div>
        <div class="bub them">점심 뭐 드셨어요? 😊</div>
      </div>
      <div class="row g10 ac" style="padding:14px 18px;border-top:1px solid var(--bt-color-border)">
        <div class="input f1" style="border-radius:999px"><span class="ph">메시지를 입력하세요</span></div>
        <div class="av s" style="background:var(--bt-color-action)">↑</div>
      </div>
    </div>
  </div>
  </div>
</div></body></html>
