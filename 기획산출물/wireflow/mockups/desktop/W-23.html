<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-23 · AI 화상 세션 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame is-dark">
<div class="appbar"><span class="logo">BloomTalk</span><div class="right"><span class="chip">AI 화상 세션</span></div></div>
  <div class="body">

  <div class="row g12 f1">
    <div class="col g10 f1">
      <div class="tile me f1" style="min-height:340px"><span class="ph">👤</span><span class="name">나 (음성 인식 중)</span>
        <div style="position:absolute;top:12px;left:12px"><span class="badge ok">풀 모드</span></div>
        <div style="position:absolute;top:12px;right:12px"><span class="timer">11:26 남음</span></div>
        <div style="position:absolute;left:0;right:0;bottom:0;padding:16px" class="col g8">
          <div class="stt">"아 저도 전시 좋아해요. 최근에 갔던 곳이…"</div>
        </div>
      </div>
      <div class="ctrl"><div class="cbtn">🎥</div><div class="cbtn">🎙</div><div class="cbtn">💡</div><div class="cbtn end">📞</div></div>
    </div>
    <div class="col g10" style="width:300px">
      <div class="emoji-stage" style="height:210px;flex:none;border-radius:16px">
        <div class="emoji-face" style="font-size:60px">😊</div>
        <div class="wave"><i style="height:8px"></i><i style="height:17px"></i><i style="height:23px"></i><i style="height:13px"></i><i style="height:19px"></i><i style="height:10px"></i></div>
        <span class="tiny" style="color:rgba(255,255,255,.42)">🤖 상대 · 실제 사람이 아닙니다</span>
      </div>
      <div class="card col g6">
        <span class="h3" style="color:var(--bt-mist-300)">AI 발화</span>
        <p class="tiny" style="color:#fff">"주말에 주로 전시 보러 다녀요. 혹시 미술관 가보신 적 있으세요?"</p>
      </div>
      <div class="coach pos"><div class="hd">🌱 코치 <span class="only-me">나만 보임</span></div>
        <div class="msg">상대 질문에 바로 답하고 되물었어요. 좋은 흐름이에요.</div></div>
      <div class="card col g6 mta">
        <div class="row jb"><span class="tiny" style="color:rgba(255,255,255,.6)">발화 비율</span><span class="tiny" style="color:#fff">54%</span></div>
        <div class="row jb"><span class="tiny" style="color:rgba(255,255,255,.6)">질문 횟수</span><span class="tiny" style="color:#fff">4회</span></div>
        <div class="row jb"><span class="tiny" style="color:rgba(255,255,255,.6)">침묵 누적</span><span class="tiny" style="color:#fff">38초</span></div>
      </div>
    </div>
  </div>
  </div>
</div></body></html>
