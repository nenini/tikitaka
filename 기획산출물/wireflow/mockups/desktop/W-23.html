<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-23 · AI 화상 세션 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame is-dark">
<div class="appbar"><span class="logo">BloomTalk</span><div class="right"><span class="chip">AI 화상 세션</span></div></div>
  <div class="body">

  <div class="row g12 f1">
    <div class="col g10 f1">
      <div class="emoji-stage">
        <div class="emoji-face">😊</div>
        <div class="wave"><i style="height:9px"></i><i style="height:19px"></i><i style="height:26px"></i><i style="height:15px"></i><i style="height:22px"></i><i style="height:11px"></i><i style="height:17px"></i></div>
        <div class="stt" style="max-width:520px">"저는 주말에 주로 전시 보러 다녀요. 혹시 미술관 같은 데 가보신 적 있으세요?"</div>
        <span class="tiny" style="color:rgba(255,255,255,.42)">🤖 상대는 실제 사람이 아닙니다</span>
      </div>
      <div class="ctrl"><div class="cbtn">🎥</div><div class="cbtn">🎙</div><div class="cbtn">💡</div><div class="cbtn end">📞</div></div>
    </div>
    <div class="col g10" style="width:322px">
      <div class="row jb ac"><span class="timer">11:26 남음</span><span class="badge ok">풀 모드</span></div>
      <div class="tile me" style="height:148px"><span class="ph">👤</span><span class="name">나</span></div>
      <div class="card col g6">
        <span class="h3" style="color:var(--bt-mist-300)">내 발화 (실시간 인식)</span>
        <p class="tiny" style="color:#fff">"아 저도 전시 좋아해요. 최근에 갔던 곳이…"</p>
      </div>
      <div class="coach pos"><div class="hd">🌱 코치 <span class="only-me">나만 보임</span></div>
        <div class="msg">상대 질문에 바로 답하고 되물었어요. 좋은 흐름이에요.</div></div>
      <div class="banner in"><span>🔔</span><span><b>실사용자 매칭이 성립했어요.</b> 연습이 끝난 뒤 수락 여부를 물어볼게요 — 세션은 그대로 이어집니다.</span></div>
      <div class="card col g6 mta">
        <div class="row jb"><span class="tiny" style="color:rgba(255,255,255,.6)">발화 비율</span><span class="tiny" style="color:#fff">54%</span></div>
        <div class="row jb"><span class="tiny" style="color:rgba(255,255,255,.6)">질문 횟수</span><span class="tiny" style="color:#fff">4회</span></div>
        <div class="row jb"><span class="tiny" style="color:rgba(255,255,255,.6)">침묵 누적</span><span class="tiny" style="color:#fff">38초</span></div>
      </div>
    </div>
  </div>
  </div>
</div></body></html>
