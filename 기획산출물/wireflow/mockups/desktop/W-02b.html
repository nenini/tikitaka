<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-02b · 성인 확인 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame">
<div class="appbar"><span class="logo">BloomTalk</span><div class="right"><span class="chip">성인 확인</span></div></div>
  <div class="body">

  <div class="col g12" style="max-width:520px;margin:0 auto;width:100%">
    <div class="row g8 ac"><span class="badge">2 / 5</span><span class="h3">성인 확인</span></div>
    <div class="meter"><i style="width:40%"></i></div>
    <div class="card pad-lg col g14">
      <div class="col g4"><h2 class="h2">생년월일을 알려주세요</h2>
        <p class="muted">만 19세 미만은 서비스를 이용할 수 없어요. 확인용으로만 쓰이고 상대에게는 <b>연령대</b>만 표시됩니다.</p></div>
      <div class="row g10">
        <div class="field f1"><label>년</label><div class="input"><span>1997</span></div></div>
        <div class="field f1"><label>월</label><div class="input"><span>04</span></div></div>
        <div class="field f1"><label>일</label><div class="input"><span>12</span></div></div>
      </div>
      <div class="banner in"><span>✅</span><span>만 <b>29세</b> · 성인 확인 완료. 프로필에는 <b>20대 후반</b>으로 표시돼요.</span></div>
      <div class="banner wa"><span>⚠️</span><span>허위 입력이 확인되면 이용이 제한될 수 있어요. 신고 대응 시 실명·생년월일이 조회됩니다.</span></div>
    </div>
    <div class="row g8"><a class="btn ghost">이전</a><a class="btn f1">다음 · 약관 동의</a></div>
  </div>
  </div>
</div></body></html>
