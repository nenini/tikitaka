<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-12 · 화상 세션 (30분) (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame is-dark">
<div class="appbar"><span class="logo">BloomTalk</span><div class="right"><span class="chip">화상 세션 (30분)</span></div></div>
  <div class="body">

  <div class="row g12 f1">
    <div class="col g10 f1">
      <div class="tile f1"><span class="ph">🧑</span><span class="name">유월 · 20대 후반</span>
        <div style="position:absolute;top:12px;left:12px" class="row g6"><span class="chip">🍽 저녁 식당</span></div>
        <div style="position:absolute;top:12px;right:12px" class="row g6 ac"><span class="timer">18:42 남음</span></div>
      </div>
      <div class="ctrl"><div class="cbtn">🎥</div><div class="cbtn">🎙</div><div class="cbtn">💡</div><div class="cbtn">🚩</div><div class="cbtn end">📞</div></div>
    </div>
    <div class="col g10" style="width:322px">
      <div class="tile me" style="height:172px"><span class="ph">👤</span><span class="name">나</span></div>
      <div class="coach pos">
        <div class="hd">🌱 코치 <span class="only-me">나만 보임</span></div>
        <div class="msg">방금 상대 말을 요약해서 되물어봤어요. 대화가 자연스럽게 이어지고 있어요.</div>
      </div>
      <div class="coach neg">
        <div class="hd">💬 코치 <span class="only-me">나만 보임</span></div>
        <div class="msg">지금은 본인이 조금 더 많이 말하고 있어요 (68%). 상대에게 질문을 돌려볼까요?</div>
      </div>
      <div class="card col g8">
        <span class="h3" style="color:var(--bt-mist-300)">이번 세션 목표</span>
        <div class="row jb ac"><span class="tiny" style="color:#fff">확장 질문 만들기</span><span class="badge ok">2 / 3</span></div>
        <div class="meter"><i style="width:66%"></i></div>
      </div>
      <div class="row g8 mta"><a class="btn dark sm f1">💡 도움</a><a class="btn dark sm f1">🚩 신고</a></div>
    </div>
  </div>
  </div>
</div></body></html>
