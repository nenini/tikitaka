<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-01 · 랜딩 · 로그인 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame">
<div class="appbar"><span class="logo">BloomTalk</span><div class="right"><span class="chip">랜딩 · 로그인</span></div></div>
  <div class="body">

  <div class="row g20 f1 ac">
    <div class="col g16 f1" style="padding-right:20px">
      <span class="badge">낯선 사람과의 대화, 연습이 됩니다</span>
      <h1 style="font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin:0">
        30분 모의 소개팅으로<br>대화 습관을 바꿔보세요</h1>
      <p class="muted" style="font-size:15px;max-width:440px">실제 소개팅 전에 연습하고, AI 코칭과 상대 피드백으로
        내 대화의 강점과 개선점을 확인하세요. <b>연애 매칭이 아니라 대화 연습 서비스</b>입니다.</p>
      <div class="row g16">
        <div class="stat"><span class="v">30분</span><span class="k">화상 세션</span></div>
        <div class="stat"><span class="v">실시간</span><span class="k">AI 코칭</span></div>
        <div class="stat"><span class="v">상호</span><span class="k">행동 피드백</span></div>
      </div>
    </div>
    <div class="card pad-lg col g10" style="width:390px">
      <h2 class="h2">시작하기</h2>
      <a class="btn block lg" style="background:#fff;color:#1f1f1f;border:1.5px solid var(--bt-color-border-strong)">
        <span>🔵</span> Google로 계속하기</a>
      <a class="btn block lg" style="background:#03C75A"><span>N</span> 네이버로 계속하기</a>
      <div class="row ac g10"><div style="flex:1;height:1px;background:var(--bt-color-border)"></div>
        <span class="tiny">또는</span><div style="flex:1;height:1px;background:var(--bt-color-border)"></div></div>
      <div class="field"><label>이메일</label><div class="input"><span class="ph">name@example.com</span></div></div>
      <div class="field"><label>비밀번호</label><div class="input"><span class="ph">••••••••</span></div></div>
      <a class="btn block">로그인</a>
      <div class="row jb"><span class="tiny">비밀번호를 잊으셨나요?</span><span class="tiny"><b>회원가입</b></span></div>
      <p class="tiny">만 19세 이상만 가입할 수 있어요.</p>
    </div>
  </div>
  </div>
</div></body></html>
