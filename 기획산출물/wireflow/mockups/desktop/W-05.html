<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-05 · 실시간 얼굴 촬영 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame is-dark">
<div class="appbar"><span class="logo">BloomTalk</span><div class="right"><span class="chip">실시간 얼굴 촬영</span></div></div>
  <div class="body">

  <div class="row g16 f1">
    <div class="tile f1" style="position:relative"><span class="ph">🙂</span>
      <div class="cam-guide" style="width:260px;height:330px"></div>
      <span class="name">카메라 미리보기</span>
      <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%)"><span class="chip">얼굴을 원 안에 맞춰주세요</span></div>
    </div>
    <div class="col g12" style="width:360px">
      <div class="col g4"><h2 class="h2" style="color:#fff">얼굴을 촬영해주세요</h2>
        <p class="tiny" style="color:rgba(255,255,255,.65)">과도한 보정을 막기 위해 <b>갤러리 업로드 없이 실시간 촬영만</b> 지원해요.</p></div>
      <div class="card col g8">
        <span class="h3" style="color:var(--bt-mist-300)">촬영 조건</span>
        <div class="row g8 ac"><span class="dot"></span><span class="tiny" style="color:#fff">얼굴 1명 감지됨</span></div>
        <div class="row g8 ac"><span class="dot"></span><span class="tiny" style="color:#fff">정면 각도 양호</span></div>
        <div class="row g8 ac"><span class="dot wa"></span><span class="tiny" style="color:#fff">조명이 조금 어두워요</span></div>
        <div class="row g8 ac"><span class="dot"></span><span class="tiny" style="color:#fff">가림 없음</span></div>
      </div>
      <div class="banner wa"><span>📸</span><span>재시도 <b>1 / 3</b> · 3회를 초과하면 얼굴상 없이 진행하고, 나중에 마이페이지에서 다시 찍을 수 있어요.</span></div>
      <div class="col g8 mta"><a class="btn block lg">촬영하기</a><a class="btn dark block">이 단계 건너뛰기</a></div>
    </div>
  </div>
  </div>
</div></body></html>
