<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-02 · 회원가입 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame">
<div class="appbar"><span class="logo">BloomTalk</span><div class="right"><span class="chip">회원가입</span></div></div>
  <div class="body">

  <div class="col g12" style="max-width:560px;margin:0 auto;width:100%">
    <div class="row g8 ac"><span class="badge">1 / 5</span><span class="h3">계정 만들기</span></div>
    <div class="meter"><i style="width:20%"></i></div>
    <div class="card pad-lg col g12">
      <div class="field"><label>이메일</label><div class="input"><span>yuwol@example.com</span></div>
        <span class="tiny">중복 확인 완료 · 로그인 ID로 사용돼요</span></div>
      <div class="row g10"><div class="field f1"><label>비밀번호</label><div class="input"><span>••••••••••</span></div></div>
        <div class="field f1"><label>비밀번호 확인</label><div class="input"><span>••••••••••</span></div></div></div>
      <div style="height:1px;background:var(--bt-color-border)"></div>
      <div class="row g8 ac"><span class="scope priv">비공개</span><span class="tiny">아래 정보는 <b>운영 목적으로만</b> 사용되고 상대에게 공개되지 않아요.</span></div>
      <div class="row g10"><div class="field f1"><label>실명</label><div class="input"><span>김유월</span></div></div>
        <div class="field f1"><label>전화번호</label><div class="input"><span>010-1234-5678</span></div></div></div>
    </div>
    <div class="row g8"><a class="btn ghost">이전</a><a class="btn f1">다음 · 성인 확인</a></div>
  </div>
  </div>
</div></body></html>
