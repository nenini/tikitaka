<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-02 · 계정 만들기 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame">
<div class="appbar"><span class="logo">BloomTalk</span><div class="right"><span class="chip">계정 만들기</span></div></div>
  <div class="body">

  <div class="col g12" style="max-width:560px;margin:0 auto;width:100%">
    <div class="row g8 ac"><span class="badge">1 / 4</span><span class="h3">계정 만들기</span></div>
    <div class="meter"><i style="width:25%"></i></div>
    <div class="card pad-lg col g12">
      <div class="field"><label>이메일</label><div class="input"><span>yuwol@example.com</span></div>
        <span class="tiny">중복 확인 완료 · 로그인 ID로 사용돼요</span></div>
      <div class="row g10"><div class="field f1"><label>비밀번호</label><div class="input"><span>••••••••••</span></div></div>
        <div class="field f1"><label>비밀번호 확인</label><div class="input"><span>••••••••••</span></div></div></div>
    </div>
    <div class="card col g10">
      <div class="row g10 ac"><span style="width:22px;height:22px;border-radius:6px;background:var(--bt-color-action);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none">✓</span>
        <div class="col g4 f1"><b style="font-size:13.5px">[필수] 약관 및 개인정보 처리에 모두 동의합니다</b>
          <span class="tiny">이용약관 · 개인정보 수집·이용 · 세션 중 표정·음성 분석 · 리포트 저장을 한 번에 동의해요.</span></div></div>
      <div style="height:1px;background:var(--bt-color-border)"></div>
      <div class="col g6">
        <div class="row jb ac"><span class="tiny">이용약관 및 개인정보 처리방침</span><span class="tiny"><b>보기 ›</b></span></div>
        <div class="row jb ac"><span class="tiny">세션 중 표정·시선·음성 분석</span><span class="tiny"><b>보기 ›</b></span></div>
        <div class="row jb ac"><span class="tiny">누적 성장 리포트 저장</span><span class="tiny"><b>보기 ›</b></span></div>
      </div>
    </div>
    <div class="banner in"><span>🔒</span><span>실명·전화번호는 <b>수집하지 않아요.</b> 본인 확인은 다음 단계에서 KYC 인증으로 진행합니다.</span></div>
    <a class="btn block">다음 · 본인인증</a>
  </div>
  </div>
</div></body></html>
