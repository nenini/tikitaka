<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-17 · 성장 대시보드 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame">
<div class="appbar"><span class="logo">BloomTalk</span>
    <div class="nav"><a class="">홈</a><a class="">매칭</a><a class="">리포트</a><a class="on">성장</a></div>
    <div class="right"><span style="font-size:17px">🔔</span><div class="av s">나</div></div></div>
  <div class="body">

  <div class="row jb ac"><div><h1 class="h1">성장 대시보드</h1>
    <p class="muted">누적 8세션 · 실사용자 6 · AI 화상 2</p></div>
    <div class="row g6"><span class="chip on">전체</span><span class="chip">실사용자</span><span class="chip">AI 트랙</span></div></div>
  <div class="row g16">
    <div class="card pad-lg col g10 f1">
      <div class="row jb ac"><span class="h3">사랑의 온도 추이</span><span class="badge ok">▲ 1.7 최근</span></div>
      <div class="row ae g6" style="height:120px">
        <div class="col f1 g4 ac"><div style="width:100%;height:30px;border-radius:6px 6px 0 0;background:var(--bt-color-action)"></div><span class="tiny">1</span></div><div class="col f1 g4 ac"><div style="width:100%;height:38px;border-radius:6px 6px 0 0;background:var(--bt-color-action)"></div><span class="tiny">2</span></div><div class="col f1 g4 ac"><div style="width:100%;height:34px;border-radius:6px 6px 0 0;background:var(--bt-color-action)"></div><span class="tiny">3</span></div><div class="col f1 g4 ac"><div style="width:100%;height:52px;border-radius:6px 6px 0 0;background:var(--bt-blue-300)"></div><span class="tiny">4</span></div><div class="col f1 g4 ac"><div style="width:100%;height:60px;border-radius:6px 6px 0 0;background:var(--bt-color-action)"></div><span class="tiny">5</span></div><div class="col f1 g4 ac"><div style="width:100%;height:55px;border-radius:6px 6px 0 0;background:var(--bt-color-action)"></div><span class="tiny">6</span></div><div class="col f1 g4 ac"><div style="width:100%;height:74px;border-radius:6px 6px 0 0;background:var(--bt-blue-300)"></div><span class="tiny">7</span></div><div class="col f1 g4 ac"><div style="width:100%;height:82px;border-radius:6px 6px 0 0;background:var(--bt-color-action)"></div><span class="tiny">8</span></div>
      </div>
      <div class="row g10"><span class="row g4 ac tiny"><span class="dot" style="background:var(--bt-color-action)"></span>실사용자</span>
        <span class="row g4 ac tiny"><span class="dot" style="background:var(--bt-blue-300)"></span>AI 트랙 (별도 표기)</span></div>
    </div>
    <div class="card pad-lg col g10" style="width:300px">
      <span class="h3">현재 온도</span>
      <div class="row ae g6"><span class="temp">38.2<small>°</small></span></div>
      <div class="meter warm"><i style="width:52%"></i></div>
      <div class="row g16 mta"><div class="stat"><span class="v">8</span><span class="k">총 세션</span></div>
        <div class="stat"><span class="v">0</span><span class="k">노쇼</span></div>
        <div class="stat"><span class="v">4</span><span class="k">뱃지</span></div></div>
    </div>
  </div>
  <div class="row g16 f1">
    <div class="card col g8 f1"><span class="h3">누적 강점</span>
      <div class="row g6 wrap"><span class="chip ok">편안한 분위기 ×5</span><span class="chip ok">공감 표현 ×4</span><span class="chip ok">경청 ×3</span></div></div>
    <div class="card col g8 f1"><span class="h3">누적 보완점</span>
      <div class="row g6 wrap"><span class="chip wa">자기 이야기 전환 ×4</span><span class="chip wa">빠른 말 속도 ×2</span></div></div>
    <div class="card col g8 f1"><span class="h3">획득 뱃지</span>
      <div class="row g6 wrap"><span class="chip">🌱 첫 연습 완료</span><span class="chip">👂 경청 향상</span><span class="chip">⚖️ 균형 잡힌 대화</span><span class="chip">🔥 5회 연속</span></div></div>
  </div>
  </div>
</div></body></html>
