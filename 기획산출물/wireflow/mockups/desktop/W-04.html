<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-04 · 기본 프로필 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame">
<div class="appbar"><span class="logo">BloomTalk</span><div class="right"><span class="chip">기본 프로필</span></div></div>
  <div class="body">

  <div class="col g12" style="max-width:760px;margin:0 auto;width:100%">
    <div class="row g8 ac"><span class="badge">4 / 5</span><span class="h3">기본 프로필</span></div>
    <div class="meter"><i style="width:80%"></i></div>
    <div class="row g16">
      <div class="card pad-lg col g12 f1">
        <div class="row g6 ac"><span class="scope pub">상대 공개</span><span class="tiny">소개팅에서 상대에게 보여요</span></div>
        <div class="field"><label>닉네임</label><div class="input"><span>유월</span></div></div>
        <div class="row g10"><div class="field f1"><label>키 (cm)</label><div class="input"><span>167</span></div></div>
          <div class="field f1"><label>성별</label><div class="input"><span>여성</span></div></div></div>
        <p class="tiny">공개 항목: <b>닉네임 · 연령대 · 키 · 얼굴상</b></p>
      </div>
      <div class="card pad-lg col g12 f1">
        <div class="row g6 ac"><span class="scope int">매칭 전용</span><span class="tiny">매칭 계산에만 쓰이고 노출되지 않아요</span></div>
        <div class="row g10"><div class="field f1"><label>시 · 도</label><div class="input"><span>서울특별시</span></div></div>
          <div class="field f1"><label>구 · 군</label><div class="input"><span>강남구</span></div></div></div>
        <div class="field"><label>선호 연령 범위</label>
          <div class="row g10 ac"><span class="tiny">26세</span>
            <div class="slider f1"><i style="width:62%"></i><b style="left:12%"></b><b style="left:62%"></b></div>
            <span class="tiny">33세</span></div></div>
        <p class="tiny">정확한 주소는 저장하지 않아요.</p>
      </div>
    </div>
    <div class="banner wa"><span>ℹ️</span><span><b>직업은 수집하지 않습니다</b> — 매칭 요소에서 제외됐어요(D-08). 매칭은 <b>시간 · 나이 · 외모 · 성격</b> 4요소로 계산됩니다.</span></div>
    <div class="row g8"><a class="btn ghost">이전</a><a class="btn f1">다음 · 얼굴 촬영</a></div>
  </div>
  </div>
</div></body></html>
