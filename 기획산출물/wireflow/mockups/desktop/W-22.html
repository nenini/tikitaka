<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>W-22 · AI 대기방 (데스크탑)</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../ui.css"></head>
<body><div class="d-frame is-dark">
<div class="appbar"><span class="logo">BloomTalk</span><div class="right"><span class="chip">AI 대기방</span></div></div>
  <div class="body">

  <div class="row g16 f1">
    <div class="col g12 f1">
      <div class="banner wa"><span>🤖</span><span><b>상대는 실제 사람이 아닙니다.</b> AI가 음성과 이모지로 반응하는 연습 세션이에요.</span></div>
      <div class="tile f1" style="min-height:300px"><span class="ph">👤</span><span class="name">내 화면 (풀 모드)</span></div>
      <div class="ctrl"><div class="cbtn">🎥</div><div class="cbtn">🎙</div><div class="cbtn">🔊</div></div>
    </div>
    <div class="col g12" style="width:360px">
      <div class="card col g10"><span class="h3" style="color:var(--bt-mist-300)">이번 연습</span>
        <div class="row jb ac"><span class="tiny" style="color:#fff">상황</span><span class="chip">첫 만남</span></div>
        <div class="row jb ac"><span class="tiny" style="color:#fff">난이도</span><span class="chip">보통</span></div>
        <div class="row jb ac"><span class="tiny" style="color:#fff">진행 시간</span><span class="chip">15분</span></div>
        <div class="row jb ac"><span class="tiny" style="color:#fff">모드</span><span class="badge ok">풀 모드</span></div>
      </div>
      <div class="card col g10"><span class="h3" style="color:var(--bt-mist-300)">기기 점검</span>
        <div class="row g8 ac"><span class="dot"></span><span class="tiny" style="color:#fff">마이크 정상 (필수)</span></div>
        <div class="row g8 ac"><span class="dot"></span><span class="tiny" style="color:#fff">카메라 정상 (선택)</span></div>
        <div class="row g8 ac"><span class="dot"></span><span class="tiny" style="color:#fff">스피커 정상 · TTS 재생 가능</span></div>
      </div>
      <div class="card col g8"><span class="h3" style="color:var(--bt-mist-300)">진행 방식</span>
        <p class="tiny" style="color:rgba(255,255,255,.72)">· AI가 음성으로 말하고 😊😐🤔 이모지로 반응해요<br>
        · 답변은 <b>음성</b>으로 하세요 — 실시간으로 인식됩니다<br>
        · 15초 이상 침묵하면 AI가 먼저 질문해요<br>
        · 음성 원본은 <b>세션 종료 즉시 삭제</b>됩니다</p></div>
      <a class="btn block lg mta">연습 시작</a>
    </div>
  </div>
  </div>
</div></body></html>
